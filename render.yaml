services:
  - type: web
    name: timelens-web
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: timelens-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: timelens-postgres
    plan: free
    databaseName: timelens
    user: timelens_user
